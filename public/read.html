<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ilm API — Read</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #0E2A2B; color: #F3ECDA; font-family: 'Work Sans', sans-serif; line-height: 1.6; }
  a { color: #C9A24B; text-decoration: none; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
  .eyebrow { color: #C9A24B; font-size: 12px; letter-spacing: 2px; font-weight: 600; }
  h1 { font-family: 'Amiri', serif; font-style: italic; font-size: 30px; margin: 10px 0 8px; }
  .lede { color: #A8967A; font-size: 14px; max-width: 600px; margin-bottom: 20px; }
  .nav-back { display: inline-block; margin-bottom: 8px; font-size: 13px; color: #A8967A; }
  .nav-links { margin-bottom: 18px; font-size: 13px; }
  .tabs { display: flex; gap: 2px; margin-bottom: 20px; border-bottom: 1px solid rgba(201,162,75,0.15); flex-wrap: wrap; }
  .tab { padding: 9px 13px; font-size: 13px; color: #A8967A; cursor: pointer; border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none; font-family: 'Work Sans', sans-serif; }
  .tab.active { color: #C9A24B; border-bottom-color: #C9A24B; }
  .panel { display: none; }
  .panel.active { display: block; }
  .controls { background: rgba(243,236,218,0.04); border: 1px solid rgba(201,162,75,0.18); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  select, input { background: #0E2A2B; color: #F3ECDA; border: 1px solid rgba(201,162,75,0.3); border-radius: 6px; padding: 9px 12px; font-size: 14px; font-family: 'Work Sans', sans-serif; flex: 1; min-width: 120px; }
  button { background: #1F6F5C; color: #F3ECDA; border: none; border-radius: 6px; padding: 10px 20px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'Work Sans', sans-serif; }
  button:hover { filter: brightness(1.08); }
  .card { background: rgba(243,236,218,0.03); border: 1px solid rgba(201,162,75,0.12); border-radius: 8px; padding: 16px 18px; margin-bottom: 12px; }
  .card-label { display: block; color: #C9A24B; font-size: 11px; letter-spacing: 1px; font-family: 'JetBrains Mono', monospace; margin-bottom: 8px; }
  .arabic { font-family: 'Amiri', serif; font-size: 22px; text-align: right; direction: rtl; line-height: 1.9; margin-bottom: 10px; }
  .body-text { color: #D8CFA9; font-size: 14.5px; }
  .note { color: #6B8F82; font-size: 12.5px; font-style: italic; margin-top: 8px; }
  .status { color: #6B8F82; font-size: 13px; font-style: italic; padding: 12px 0; }
  .error { color: #C1533D; font-size: 13px; padding: 12px 0; }
  .madhab-tag { display: inline-block; background: rgba(201,162,75,0.15); color: #C9A24B; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-bottom: 8px; }
  .small-btn { background: none; border: 1px solid rgba(201,162,75,0.4); color: #C9A24B; padding: 4px 10px; font-size: 12px; border-radius: 5px; margin-top: 6px; cursor: pointer; }
  .small-btn:hover { background: rgba(201,162,75,0.1); }
  .words-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; direction: rtl; }
  .word-chip { background: rgba(243,236,218,0.04); border: 1px solid rgba(201,162,75,0.15); border-radius: 6px; padding: 8px 10px; text-align: center; min-width: 70px; }
  .word-chip .wa { font-family: 'Amiri', serif; font-size: 20px; display: block; margin-bottom: 4px; }
  .word-chip .wp { color: #6B8F82; font-size: 10px; font-family: 'JetBrains Mono', monospace; display: block; direction: ltr; }
  .word-chip .wr { color: #A8967A; font-size: 10px; display: block; direction: ltr; }
</style>
</head>
<body>
<div class="wrap">
  <a class="nav-back" href="/">&larr; Back to documentation</a>
  <div class="nav-links"><a href="/prayer.html">Prayer times &amp; Qibla direction →</a></div>
  <div class="eyebrow">ILM API — READ</div>
  <h1>Read &amp; search Islamic knowledge</h1>
  <p class="lede">No account or technical knowledge needed. Bilingual Arabic + English hadith, word-by-word Quran grammar, and root-word search are all live.</p>

  <div class="tabs">
    <button class="tab active" data-tab="quran">Quran</button>
    <button class="tab" data-tab="tafsir">Tafsir</button>
    <button class="tab" data-tab="hadith">Hadith</button>
    <button class="tab" data-tab="isnad">Isnad</button>
    <button class="tab" data-tab="duas">Du'as</button>
    <button class="tab" data-tab="fiqh">Fiqh</button>
    <button class="tab" data-tab="roots">Roots</button>
  </div>

  <div class="panel active" id="panel-quran">
    <div class="controls">
      <div class="row">
        <select id="surah-select"></select>
        <select id="translation-select">
          <optgroup label="English">
            <option value="en.sahih">Saheeh International</option>
            <option value="en.yusufali">Abdullah Yusuf Ali</option>
            <option value="en.pickthall">M. M. Pickthall</option>
            <option value="en.hilali">Hilali &amp; Khan</option>
            <option value="en.clearquran">The Clear Quran (simplified)</option>
          </optgroup>
          <optgroup label="African languages">
            <option value="ha.gumi">Hausa — Abubakar Gumi</option>
            <option value="sw.barwani">Swahili — Ali Muhsin Al-Barwani</option>
            <option value="am.sadiq">Amharic — Sadiq &amp; Sani</option>
          </optgroup>
          <optgroup label="Asian languages">
            <option value="ur.jalandhari">Urdu — F. M. Jalandhari</option>
            <option value="bn.mujiburrahman">Bengali — Mujibur Rahman</option>
            <option value="id.kemenag">Indonesian — Kemenag</option>
            <option value="ms.basmeih">Malay — Basmeih</option>
            <option value="zh.majian">Chinese — Ma Jian</option>
          </optgroup>
          <optgroup label="European languages">
            <option value="fr.hamidullah">French — Hamidullah</option>
            <option value="es.garcia">Spanish — Isa Garcia</option>
            <option value="de.bubenheim">German — Bubenheim &amp; Elyas</option>
            <option value="pt.nasr">Portuguese — Helmi Nasr</option>
            <option value="ru.kuliev">Russian — Kuliev</option>
          </optgroup>
        </select>
      </div>
      <button id="quran-read-btn">Read Surah</button>
    </div>
    <div id="quran-results"></div>
  </div>

  <div class="panel" id="panel-tafsir">
    <div class="controls">
      <div class="row">
        <input id="tafsir-surah" type="number" placeholder="Surah (e.g. 2)" min="1" max="114" />
        <input id="tafsir-ayah" type="number" placeholder="Ayah (e.g. 255)" min="1" />
      </div>
      <button id="tafsir-btn">Get Tafsir</button>
    </div>
    <div id="tafsir-results"></div>
  </div>

  <div class="panel" id="panel-hadith">
    <div class="controls">
      <div class="row">
        <input id="hadith-query" type="text" placeholder="Search hadith — e.g. patience, charity, intention" />
        <button id="hadith-search-btn">Search</button>
      </div>
      <div class="row">
        <select id="hadith-lookup-collection">
          <option value="bukhari">Sahih al-Bukhari</option>
          <option value="muslim">Sahih Muslim</option>
          <option value="abudawud">Sunan Abu Dawud</option>
          <option value="tirmidhi">Jami at-Tirmidhi</option>
          <option value="nasai">Sunan an-Nasa'i</option>
          <option value="ibnmajah">Sunan Ibn Majah</option>
        </select>
        <input id="hadith-lookup-number" type="text" placeholder="Hadith # (e.g. 1)" />
        <button id="hadith-lookup-btn">Look Up</button>
      </div>
    </div>
    <div id="hadith-results"></div>
  </div>

  <div class="panel" id="panel-isnad">
    <div class="controls">
      <div class="row">
        <select id="isnad-collection">
          <option value="bukhari">Sahih al-Bukhari</option>
          <option value="muslim">Sahih Muslim</option>
          <option value="abudawud">Sunan Abu Dawud</option>
          <option value="tirmidhi">Jami at-Tirmidhi</option>
          <option value="nasai">Sunan an-Nasa'i</option>
          <option value="ibnmajah">Sunan Ibn Majah</option>
        </select>
        <input id="isnad-number" type="text" placeholder="Hadith number (e.g. 1)" />
      </div>
      <button id="isnad-btn">Get Narrator Chain</button>
    </div>
    <div id="isnad-results"></div>
  </div>

  <div class="panel" id="panel-duas">
    <div class="controls">
      <div class="row">
        <select id="dua-category"></select>
      </div>
      <button id="dua-btn">Show Du'as</button>
    </div>
    <div id="dua-results"></div>
  </div>

  <div class="panel" id="panel-fiqh">
    <div class="controls">
      <div class="row">
        <input id="fiqh-topic" type="text" placeholder="Topic — e.g. fasting, prayer" />
        <button id="fiqh-btn">Compare Rulings</button>
      </div>
    </div>
    <div id="fiqh-results"></div>
  </div>

  <div class="panel" id="panel-roots">
    <div class="controls">
      <div class="row">
        <input id="root-input" type="text" placeholder="Arabic root — e.g. رحم" style="direction: rtl; text-align: right; font-family: 'Amiri', serif; font-size: 18px;" />
        <button id="root-btn">Find Occurrences</button>
      </div>
    </div>
    <div id="root-results"></div>
  </div>
</div>

<script>
const API_BASE = '';
let apiKey = null;

const SURAHS = [
  "Al-Fatihah","Al-Baqarah","Aal-E-Imran","An-Nisa","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal","At-Tawbah","Yunus",
  "Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Ta-Ha",
  "Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Ash-Shu'ara","An-Naml","Al-Qasas","Al-Ankabut","Ar-Rum",
  "Luqman","As-Sajdah","Al-Ahzab","Saba","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir",
  "Fussilat","Ash-Shuraa","Az-Zukhruf","Ad-Dukhan","Al-Jathiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf",
  "Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadila","Al-Hashr","Al-Mumtahanah",
  "As-Saf","Al-Jumu'ah","Al-Munafiqun","At-Taghabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij",
  "Nuh","Al-Jinn","Al-Muzzammil","Al-Muddaththir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","Abasa",
  "At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Ghashiyah","Al-Fajr","Al-Balad",
  "Ash-Shams","Al-Layl","Ad-Duhaa","Ash-Sharh","At-Tin","Al-Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-Adiyat",
  "Al-Qari'ah","At-Takathur","Al-Asr","Al-Humazah","Al-Fil","Quraysh","Al-Ma'un","Al-Kawthar","Al-Kafirun","An-Nasr",
  "Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"
];

function populateSurahSelect() {
  const select = document.getElementById('surah-select');
  SURAHS.forEach((name, i) => {
    const opt = document.createElement('option');
    opt.value = i + 1; opt.textContent = `${i + 1}. ${name}`;
    select.appendChild(opt);
  });
}

document.querySelectorAll('.tab').forEach((tab) => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(`panel-${tab.dataset.tab}`).classList.add('active');
  });
});

async function ensureApiKey() {
  if (apiKey) return apiKey;
  const stored = sessionStorage.getItem('ilm_reader_key');
  if (stored) { apiKey = stored; return apiKey; }
  const randomEmail = `reader-${Math.random().toString(36).slice(2)}@anonymous.local`;
  const res = await fetch(`${API_BASE}/v1/developers/signup`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: randomEmail }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Could not set up reader access');
  apiKey = data.key;
  sessionStorage.setItem('ilm_reader_key', apiKey);
  return apiKey;
}

async function apiGet(path) {
  const key = await ensureApiKey();
  const res = await fetch(`${API_BASE}${path}`, { headers: { 'x-api-key': key } });
  const contentType = res.headers.get('content-type') || '';
  const data = contentType.includes('application/json')
    ? await res.json()
    : { error: await res.text() };
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (character) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;',
  }[character]));
}

function showError(element, error, suffix = '') {
  element.innerHTML = `<div class="error">${escapeHtml(error?.message || 'Something went wrong')}${escapeHtml(suffix)}</div>`;
}

// --- Quran ---
document.getElementById('quran-read-btn').addEventListener('click', async () => {
  const surah = document.getElementById('surah-select').value;
  const translation = document.getElementById('translation-select').value;
  const el = document.getElementById('quran-results');
  el.innerHTML = '<div class="status">Loading…</div>';
  try {
    const data = await apiGet(`/v1/quran/${surah}?translation=${translation}`);
    el.innerHTML = data.ayahs.map((a) => `
      <div class="card" data-surah="${escapeHtml(surah)}" data-ayah="${escapeHtml(a.ayah_number)}">
        <span class="card-label">${escapeHtml(data.surah.name_english.toUpperCase())} — AYAH ${escapeHtml(a.ayah_number)}</span>
        <div class="arabic">${escapeHtml(a.text_arabic)}</div>
        <div class="body-text">${escapeHtml(a.translation || '(no translation available)')}</div>
        <button class="small-btn words-toggle">Word-by-word translation &amp; grammar ▾</button>
        <div class="words-grid" style="display:none;"></div>
      </div>`).join('');
    el.querySelectorAll('.words-toggle').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const card = btn.closest('.card');
        const grid = card.querySelector('.words-grid');
        if (grid.style.display !== 'none' && grid.innerHTML) {
          grid.style.display = grid.style.display === 'none' ? 'flex' : 'none';
          return;
        }
        grid.style.display = 'flex';
        grid.innerHTML = '<div class="status">Loading…</div>';
        try {
          const wdata = await apiGet(`/v1/quran/${card.dataset.surah}/${card.dataset.ayah}/words`);
          grid.innerHTML = wdata.words.map((w) => `
            <div class="word-chip" data-audio="${w.audio_url ? escapeHtml('https://audio.qurancdn.com/' + w.audio_url) : ''}">
              ${w.audio_url ? '<span class="word-play">▶</span>' : ''}
              <span class="wa">${escapeHtml(w.text_arabic)}</span>
              <span class="wl">${escapeHtml(w.transliteration || '')}</span>
              <span class="wt">${escapeHtml(w.translation || '')}</span>
              <span class="wp">${escapeHtml(w.part_of_speech || '')}</span>
              <span class="wr">${w.root_arabic ? 'root: ' + escapeHtml(w.root_arabic) : ''}</span>
            </div>`).join('');
        grid.querySelectorAll('.word-chip[data-audio]:not([data-audio=""])').forEach((chip) => {
          chip.addEventListener('click', () => {
            const url = chip.dataset.audio;
            if (!url) return;
            let player = document.getElementById('word-player');
            if (!player) {
              player = document.createElement('audio');
              player.id = 'word-player';
              document.body.appendChild(player);
            }
            player.src = url;
            player.play();
          });
        });
        } catch (err) {
          grid.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
        }
      });
    });
  } catch (err) {
    if (err.message.includes('Category not found or has no duas')) {
      el.innerHTML = '<div class="status">No du&#39;as are available in this category yet.</div>';
    } else {
      showError(el, err);
    }
  }
});

// --- Tafsir ---
document.getElementById('tafsir-btn').addEventListener('click', async () => {
  const surah = document.getElementById('tafsir-surah').value;
  const ayah = document.getElementById('tafsir-ayah').value;
  const el = document.getElementById('tafsir-results');
  if (!surah || !ayah) { el.innerHTML = '<div class="error">Enter both a surah and ayah number.</div>'; return; }
  el.innerHTML = '<div class="status">Loading…</div>';
  try {
    const data = await apiGet(`/v1/tafsir/${surah}/${ayah}`);
    el.innerHTML = data.tafsir.map((t) => `
      <div class="card">
        <span class="card-label">${escapeHtml(t.source.toUpperCase())}</span>
        <div class="body-text">${escapeHtml(t.text)}</div>
      </div>`).join('');
  } catch (err) { showError(el, err); }
});

// --- Hadith search ---
document.getElementById('hadith-search-btn').addEventListener('click', async () => {
  const q = document.getElementById('hadith-query').value.trim();
  const el = document.getElementById('hadith-results');
  if (!q) { el.innerHTML = '<div class="error">Type something to search for.</div>'; return; }
  el.innerHTML = '<div class="status">Searching…</div>';
  try {
    const data = await apiGet(`/v1/hadith/search?q=${encodeURIComponent(q)}`);
    if (data.results.length === 0) { el.innerHTML = '<div class="status">No results found.</div>'; return; }
    el.innerHTML = data.results.map((h) => `
      <div class="card">
        <span class="card-label">${escapeHtml(h.collection.toUpperCase())} — #${escapeHtml(h.hadith_number)}${h.narrator ? ' — ' + escapeHtml(h.narrator) : ''}</span>
        ${h.text_arabic ? `<div class="arabic">${escapeHtml(h.text_arabic)}</div>` : ''}
        <div class="body-text">${escapeHtml(h.text_english)}</div>
      </div>`).join('');
  } catch (err) { showError(el, err); }
});

// --- Hadith direct lookup (bilingual) ---
document.getElementById('hadith-lookup-btn').addEventListener('click', async () => {
  const collection = document.getElementById('hadith-lookup-collection').value;
  const number = document.getElementById('hadith-lookup-number').value.trim();
  const el = document.getElementById('hadith-results');
  if (!number) { el.innerHTML = '<div class="error">Enter a hadith number.</div>'; return; }
  el.innerHTML = '<div class="status">Loading…</div>';
  try {
    const h = await apiGet(`/v1/hadith/${collection}/${number}`);
    el.innerHTML = `
      <div class="card">
        <span class="card-label">${escapeHtml(collection.toUpperCase())} — #${escapeHtml(h.hadith_number)}${h.narrator ? ' — ' + escapeHtml(h.narrator) : ''}${h.grade ? ' — ' + escapeHtml(h.grade) : ''}</span>
        ${h.text_arabic ? `<div class="arabic">${escapeHtml(h.text_arabic)}</div>` : ''}
        <div class="body-text">${escapeHtml(h.text_english)}</div>
        ${h.book_name || h.chapter_name ? `<div class="note">${escapeHtml(h.book_name || '')}${h.chapter_name ? ' — ' + escapeHtml(h.chapter_name) : ''}</div>` : ''}
      </div>`;
  } catch (err) { showError(el, err); }
});

// --- Isnad ---
document.getElementById('isnad-btn').addEventListener('click', async () => {
  const collection = document.getElementById('isnad-collection').value;
  const number = document.getElementById('isnad-number').value.trim();
  const el = document.getElementById('isnad-results');
  if (!number) { el.innerHTML = '<div class="error">Enter a hadith number.</div>'; return; }
  el.innerHTML = '<div class="status">Loading…</div>';
  try {
    const data = await apiGet(`/v1/hadith/${collection}/${number}/isnad`);
    el.innerHTML = data.chain.map((n) => `
      <div class="card">
        <span class="card-label">POSITION ${escapeHtml(n.chain_position)} — ${escapeHtml(n.generation || '')}${n.reliability_grade ? ' — ' + escapeHtml(n.reliability_grade) : ''}</span>
        <div class="body-text"><strong style="color:#F3ECDA;">${escapeHtml(n.name_english)}</strong>${n.kunya ? ' (' + escapeHtml(n.kunya) + ')' : ''}</div>
        ${n.bio ? `<div class="note">${escapeHtml(n.bio)}</div>` : ''}
      </div>`).join('');
  } catch (err) { showError(el, err, ' — narrator chains are only available for a small starter set right now.'); }
});

// --- Duas ---
async function loadDuaCategories() {
  const select = document.getElementById('dua-category');
  const button = document.getElementById('dua-btn');
  try {
    const data = await apiGet('/v1/duas/categories');
    select.innerHTML = data.map((c) => `<option value="${escapeHtml(c.slug)}">${escapeHtml(c.name)}</option>`).join('');
    button.disabled = data.length === 0;
  } catch (err) {
    button.disabled = true;
    select.innerHTML = '<option value="">Unable to load categories</option>';
    showError(document.getElementById('dua-results'), err);
  }
}
document.getElementById('dua-btn').addEventListener('click', async () => {
  const category = document.getElementById('dua-category').value;
  const el = document.getElementById('dua-results');
  if (!category) { showError(el, new Error('No Du’a category is available right now.')); return; }
  el.innerHTML = '<div class="status">Loading…</div>';
  try {
    const data = await apiGet(`/v1/duas/${category}`);
    el.innerHTML = data.map((d) => `
      <div class="card">
        <span class="card-label">${escapeHtml(d.title.toUpperCase())}</span>
        <div class="arabic">${escapeHtml(d.text_arabic)}</div>
        ${d.transliteration ? `<div class="note">${escapeHtml(d.transliteration)}</div>` : ''}
        <div class="body-text">${escapeHtml(d.translation)}</div>
        ${d.reference ? `<div class="note">— ${escapeHtml(d.reference)}</div>` : ''}
      </div>`).join('');
  } catch (err) { showError(el, err); }
});

// --- Fiqh ---
document.getElementById('fiqh-btn').addEventListener('click', async () => {
  const topic = document.getElementById('fiqh-topic').value.trim();
  const el = document.getElementById('fiqh-results');
  if (!topic) { el.innerHTML = '<div class="error">Enter a topic to search.</div>'; return; }
  el.innerHTML = '<div class="status">Searching…</div>';
  try {
    const data = await apiGet(`/v1/fiqh/search?topic=${encodeURIComponent(topic)}`);
    if (data.rulings.length === 0) { el.innerHTML = '<div class="status">No rulings found for this topic yet — this is a starter dataset.</div>'; return; }
    el.innerHTML = data.rulings.map((r) => `
      <div class="card">
        <span class="madhab-tag">${escapeHtml(r.madhab)}</span>
        <div class="body-text"><strong style="color:#F3ECDA;">${escapeHtml(r.question)}</strong></div>
        <div class="body-text" style="margin-top:8px;">${escapeHtml(r.ruling)}</div>
        ${r.reference ? `<div class="note">— ${escapeHtml(r.reference)}</div>` : ''}
      </div>`).join('');
  } catch (err) { showError(el, err); }
});

// --- Roots ---
document.getElementById('root-btn').addEventListener('click', async () => {
  const root = document.getElementById('root-input').value.trim();
  const el = document.getElementById('root-results');
  if (!root) { el.innerHTML = '<div class="error">Enter an Arabic root, e.g. رحم</div>'; return; }
  el.innerHTML = '<div class="status">Searching…</div>';
  try {
    const data = await apiGet(`/v1/roots/${encodeURIComponent(root)}/occurrences`);
    if (!data.occurrences || data.occurrences.length === 0) { el.innerHTML = '<div class="status">No occurrences found for this root.</div>'; return; }
    el.innerHTML = `<div class="note">${escapeHtml(data.count)} occurrence(s) found</div>` + data.occurrences.map((o) => `
      <div class="card">
        <span class="card-label">SURAH ${escapeHtml(o.surah_number)} — AYAH ${escapeHtml(o.ayah_number)}</span>
        <div class="arabic">${escapeHtml(o.word)}</div>
        <div class="note">${escapeHtml(o.part_of_speech || '')}</div>
      </div>`).join('');
  } catch (err) { showError(el, err); }
});

populateSurahSelect();
loadDuaCategories();
</script>
</body>
</html>
